{% extends "base.html" %}

{% block content %}

<div class="books">
{% for book in books %}
<div class="card text-center">
  <div class="card-header">
    <img style="width: 200px;" src="{{book.image.url}}" alt="">
    <h1>{{book.title}}</h1>
  </div>
  <div class="card-body">
    <h5 class="card-title">{{book.description}}</h5>
    <p class="card-text">{{book.date}}</p>
    <a href="{% url 'book_detail' book.id %}" class="btn btn-primary">Подробнее</a>
  </div>
  <div class="card-footer text-body-secondary">
    Количество на скаде: {{book.quantity}}
  </div>
</div>
{% endfor %}
</div>
{% endblock content %}
